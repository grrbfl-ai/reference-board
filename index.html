<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>레퍼런스 창고</title>
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151916" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="레퍼런스">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f07a1a'/%3E%3Cpath d='M20 14h24v38l-12-9-12 9z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.js"></script>
<style>
/* Layout: 세 공간(영상 레퍼런스 · 썸네일 보드 · 후킹 문구)을 위 탭으로 오가는 스크랩 보드. */
:root {
  --bg: #eef0ec; --surface: #ffffff; --ink: #1d221f; --muted: #66706a; --line: #d6dbd5;
  --accent: #f07a1a; --accent-ink: #ffffff; --chip: #e4e8e2; --danger: #c8372d;
  --c-script: #3a6df0; --c-visual: #e0446a; --c-format: #1f9a6a; --c-thumb: #c98a00; --c-edit: #7a4fd6;
  --c-teal: #0f8c9c; --c-brown: #9a5b2e; --c-slate: #55607a;
  --f-display: "Black Han Sans", "Gothic A1", system-ui, sans-serif;
  --f-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151916; --surface: #1f2420; --ink: #eef1ec; --muted: #9aa49d; --line: #333a35;
    --accent: #ff9440; --accent-ink: #1a1208; --chip: #2a302b; --danger: #ff6b5f;
    --c-script: #7b9dff; --c-visual: #ff7d9b; --c-format: #4fd1a0; --c-thumb: #f0b532; --c-edit: #a888ff;
    --c-teal: #4cc9d6; --c-brown: #d6905c; --c-slate: #9aa6c4;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; display: grid; gap: 18px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 6vw, 40px); line-height: 1; margin: 0; letter-spacing: -0.01em; }
.brand h1 .dot { color: var(--accent); }
.head-acts { display: flex; align-items: center; gap: 10px; }
.btn-add { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 800; font-size: 15px; }
.btn-add:disabled { opacity: .5; cursor: wait; }
.btn-ghost { background: none; border: 0; color: var(--muted); font-size: 13px; font-weight: 700; padding: 8px; border-radius: 8px; }
.btn-ghost:hover { background: var(--chip); }

/* 공간 전환 */
.spaces { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-bottom: 2px solid var(--line); }
.space { border: 0; background: none; padding: 10px 6px 12px; font-weight: 800; font-size: 15px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; display: grid; gap: 2px; justify-items: center; }
.space .n { font-family: var(--f-mono); font-size: 12px; font-weight: 500; }
.space[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.space-hint { margin: -6px 0 0; color: var(--muted); font-size: 13px; }

nav.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.tab { flex: none; display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; }
.tab .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--sw, var(--ink)); }
.tab .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab[aria-pressed="true"] .n { color: inherit; opacity: .7; }

.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 260px; min-width: 0; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; font-size: 16px; }
.tagrow { display: flex; flex-wrap: wrap; gap: 6px; }
.tagf { border: 0; background: var(--chip); border-radius: 6px; padding: 5px 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
.tagf[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* 영상 레퍼런스 카드 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.thumb { aspect-ratio: 4 / 5; max-width: 100%; background: var(--chip); position: relative; display: grid; place-items: center; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .ph { font-family: var(--f-display); font-size: 26px; color: var(--cat); text-align: center; padding: 0 16px; line-height: 1.15; }
.thumb.short { aspect-ratio: 16 / 7; }
.label { position: absolute; top: 10px; left: 10px; background: var(--cat); color: #fff; font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 6px; letter-spacing: .02em; }
.plat { position: absolute; top: 10px; right: 10px; background: var(--surface); color: var(--ink); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); }
.body { padding: 14px 16px 16px; display: grid; gap: 10px; min-width: 0; }
.body h3 { margin: 0; font-size: 16px; font-weight: 800; line-height: 1.35; overflow-wrap: anywhere; text-wrap: balance; }
.why { margin: 0; font-size: 14px; line-height: 1.6; border-left: 3px solid var(--cat, var(--muted)); padding-left: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.k { display: block; font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .06em; }
.idea { margin: 0; font-size: 14px; line-height: 1.6; background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.idea .k { color: var(--accent); }
.script { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.script summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .04em; }
.script summary::-webkit-details-marker { display: none; }
.script summary::after { content: "펼치기"; font-weight: 700; color: var(--accent); letter-spacing: 0; }
.script[open] summary::after { content: "접기"; }
.script .txt { margin: 0; padding: 0 10px 8px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow-y: auto; }
.mini { border: 0; background: var(--chip); border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 700; color: var(--ink); }
.script .mini { margin: 0 10px 10px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tags span { background: var(--chip); border-radius: 5px; padding: 2px 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
.meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 4px; border-top: 1px dashed var(--line); }
.meta time { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.acts a, .acts button { border: 0; background: none; font-size: 13px; font-weight: 700; color: var(--muted); padding: 6px 8px; border-radius: 6px; text-decoration: none; }
.acts a { color: var(--accent); }
.acts button:hover, .acts a:hover { background: var(--chip); }
.del.armed { color: var(--danger) !important; }

/* 썸네일 보드 */
.uploader { border: 2px dashed var(--line); border-radius: 14px; padding: 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; background: var(--surface); }
.uploader.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.uploader p { margin: 0; color: var(--muted); font-size: 14px; }
.uploader p strong { color: var(--ink); display: block; font-size: 15px; }
.uploader .prog { font-family: var(--f-mono); font-size: 13px; color: var(--accent); }
@media (hover: none) and (pointer: coarse) { .uploader { padding: 10px 14px; } .uploader p, .uploader .btn-add { display: none; } .uploader:has(.prog[hidden]) { display: none; } }
.masonry { columns: 2; column-gap: 10px; }
@media (min-width: 640px) { .masonry { columns: 5 200px; column-gap: 12px; } }
.masonry > .empty { break-inside: avoid; }
.pin { break-inside: avoid; margin: 0 0 10px; display: block; width: 100%; border: 0; padding: 0; background: var(--chip); border-radius: 12px; overflow: hidden; position: relative; text-align: left; }
.pin img { display: block; width: 100%; height: auto; }
.pin .cap { position: absolute; inset: auto 0 0 0; padding: 24px 10px 8px; color: #fff; font-size: 12px; font-weight: 700; line-height: 1.35; background: linear-gradient(transparent, rgba(0,0,0,.7)); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* 후킹 문구 */
.hookgrid { columns: 1; column-gap: 14px; }
@media (min-width: 700px) { .hookgrid { columns: 2; } }
@media (min-width: 1040px) { .hookgrid { columns: 3; } }
.hookgrid > .empty { break-inside: avoid; }
.hook { break-inside: avoid; margin: 0 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.hook .line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.hook blockquote { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
.hook blockquote::before { content: "“"; font-family: var(--f-display); color: var(--accent); font-size: 28px; line-height: 0; margin-right: 2px; vertical-align: -10px; }
.copybtn { border: 1.5px solid var(--accent); color: var(--accent); background: none; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 800; white-space: nowrap; }
.copybtn.done { background: var(--accent); color: var(--accent-ink); }
.hook .hcat { justify-self: start; background: var(--cat); color: #fff; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 6px; }
.hook .src { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.hook .src a { color: var(--muted); }
.hook .note { margin: 0; font-size: 14px; line-height: 1.6; border-left: 3px solid var(--line); padding-left: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }

.empty, .notice { background: var(--surface); border: 1.5px dashed var(--line); border-radius: 14px; padding: 32px 20px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty strong { color: var(--ink); font-size: 17px; }
.notice code { font-family: var(--f-mono); font-size: 12px; color: var(--danger); overflow-wrap: anywhere; }

/* 로그인 */
.login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
.login form { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; display: grid; gap: 14px; }
.login h1 { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1; margin: 0 0 4px; }
.login h1 .dot { color: var(--accent); }
.login p { margin: 0 0 6px; color: var(--muted); font-size: 14px; }
.login .btn-add { width: 100%; }

/* 시트(입력창·크게 보기) */
.sheet { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel { background: var(--surface); border-radius: 16px; width: min(560px, 100%); max-height: 100%; overflow-y: auto; padding: 22px; display: grid; gap: 14px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 800; }
.field small { color: var(--muted); font-size: 12px; font-weight: 500; }
.field input, .field select, .field textarea { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; font-size: 16px; }
.field textarea { min-height: 84px; resize: vertical; }
.field textarea.tall { min-height: 140px; }
.field textarea.big { min-height: 96px; font-weight: 700; font-size: 17px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }
.catpick { display: flex; flex-wrap: wrap; gap: 6px; }
.catpick button { border: 1.5px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 11px; font-size: 13px; font-weight: 700; }
.catpick button[aria-pressed="true"] { background: var(--cat); border-color: var(--cat); color: #fff; }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center; color: var(--muted); font-size: 13px; display: grid; gap: 8px; justify-items: center; }
.drop.over { border-color: var(--accent); color: var(--ink); }
.drop img { max-height: 160px; border-radius: 8px; }
.lnk { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 13px; padding: 0; }
.panel-acts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.panel-acts button { border-radius: 999px; padding: 10px 18px; font-weight: 800; border: 1.5px solid var(--line); background: none; }
.panel-acts .save { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.panel-acts .save:disabled { opacity: .6; cursor: wait; }
.panel-acts .left { margin-right: auto; }
.err { color: var(--danger); font-size: 13px; margin: 0; }

.viewer-panel { background: var(--surface); border-radius: 16px; width: min(900px, 100%); max-height: 100%; overflow-y: auto; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
.viewer-panel .vimg { background: var(--chip); display: grid; place-items: center; min-height: 200px; }
.viewer-panel .vimg img { width: 100%; max-height: 84vh; object-fit: contain; display: block; }
.viewer-panel .vbody { padding: 20px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.viewer-panel time { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
@media (max-width: 700px) { .viewer-panel { grid-template-columns: 1fr; } .viewer-panel .vimg img { max-height: 62vh; } }
@media (prefers-reduced-motion: no-preference) { .card, .hook { transition: transform .15s ease; } .card:hover, .hook:hover { transform: translateY(-2px); } }
</style>
</head>
<body>

<!-- 로그인 -->
<section class="login" id="loginView" hidden>
  <form id="loginForm">
    <h1>레퍼런스 창고<span class="dot">.</span></h1>
    <p id="loginMsg">귤 전용. 로그인하면 저장한 레퍼런스가 보여요.</p>
    <label class="field"><span>이메일</span>
      <input id="l-email" type="email" autocomplete="username" required>
    </label>
    <label class="field"><span>비밀번호</span>
      <input id="l-pw" type="password" autocomplete="current-password" required>
    </label>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn-add" type="submit" id="loginBtn">로그인</button>
  </form>
</section>

<!-- 메인 -->
<div class="wrap" id="appView" hidden>
  <header class="top">
    <div class="brand"><h1>레퍼런스 창고<span class="dot">.</span></h1></div>
    <div class="head-acts">
      <button class="btn-ghost" id="logoutBtn" type="button">로그아웃</button>
      <button class="btn-add" id="addBtn" type="button">+ 추가</button>
    </div>
  </header>

  <nav class="spaces" id="spaces" aria-label="공간">
    <button class="space" type="button" data-space="refs">영상 레퍼런스<span class="n" id="n-refs">0</span></button>
    <button class="space" type="button" data-space="thumbs">썸네일 보드<span class="n" id="n-thumbs">0</span></button>
    <button class="space" type="button" data-space="hooks">후킹 문구<span class="n" id="n-hooks">0</span></button>
  </nav>
  <p class="space-hint" id="spaceHint"></p>

  <nav class="tabs" id="tabs" aria-label="카테고리"></nav>

  <div class="uploader" id="uploader" hidden>
    <p><strong>캡처를 끌어다 놓거나 붙여넣기(⌘V)</strong>여러 장도 한 번에 올라가요. 메모는 나중에 눌러서 달면 돼요.</p>
    <span class="prog" id="upProg" hidden></span>
    <button class="btn-add" type="button" id="thumbPick">사진 올리기</button>
    <input id="thumbFiles" type="file" accept="image/*" multiple hidden>
  </div>

  <div class="filters">
    <input class="search" id="q" type="search" placeholder="찾기">
    <div class="tagrow" id="tagrow"></div>
  </div>

  <div id="status" hidden></div>
  <section id="list" aria-live="polite"></section>
</div>

<!-- 영상 레퍼런스 입력 -->
<div class="sheet" id="refSheet" hidden>
  <form class="panel" id="refForm" autocomplete="off">
    <h2 id="refFormTitle">레퍼런스 추가</h2>
    <label class="field"><span>링크</span>
      <input id="f-url" type="url" inputmode="url" placeholder="https://www.instagram.com/reel/...">
    </label>
    <label class="field"><span>제목</span>
      <input id="f-title" type="text" placeholder="예: 시골집 문 여는 첫 컷으로 시작하는 릴스">
    </label>
    <div class="field"><span>카테고리</span><div class="catpick" id="f-cat"></div></div>
    <div class="row2">
      <label class="field"><span>플랫폼</span>
        <select id="f-plat"><option>릴스</option><option>쇼츠</option><option>유튜브</option><option>틱톡</option><option>기타</option></select>
      </label>
      <label class="field"><span>태그 <small>쉼표로 구분</small></span>
        <input id="f-tags" type="text" placeholder="여행, 로컬, 정보형">
      </label>
    </div>
    <label class="field"><span>왜 저장했나</span>
      <textarea id="f-why" placeholder="예: 첫 1초에 손이 문고리를 잡는 클로즈업. 소리부터 들려서 멈추게 됨"></textarea>
    </label>
    <label class="field"><span>응용 아이디어 <small>노는법에선 이렇게 써보기</small></span>
      <textarea id="f-idea" placeholder="예: 담양 독채 소개 릴스 첫 컷을 대문 여는 손으로. 대나무 바람 소리 먼저 깔기"></textarea>
    </label>
    <label class="field"><span>스크립트 <small>영상 대사·자막을 그대로 옮겨두기</small></span>

      el("h3", {}, r.title || "(제목 없음)"),
      r.why ? el("p", { class: "why" }, el("span", { class: "k" }, "왜 저장했나"), r.why) : null,
      r.idea ? el("p", { class: "idea" }, el("span", { class: "k" }, "응용 아이디어"), r.idea) : null,
      r.script ? scriptBox(r.script) : null,
      tagsEl(r.tags),
      el("div", { class: "meta" }, el("time", {}, fmtDate(r.created_at)),
        el("div", { class: "acts" },
          r.url ? el("a", { href: r.url, target: "_blank", rel: "noopener" }, "원본 보기 ↗") : null,
          el("button", { type: "button", onclick: () => openRefForm(r) }, "수정"), del))));
}

/* 썸네일 보드 */
function renderThumbs(list) {
  if (!S.thumbs.length) { list.append(emptyBox("아직 올린 썸네일이 없어요", "위 칸에 캡처를 끌어다 놓거나 '사진 올리기'를 눌러 여러 장 한 번에 올려 보세요.")); return; }
  const rows = S.thumbs.filter(t => hit([t.memo]));
  if (!rows.length) { list.append(emptyBox("메모에 맞는 썸네일이 없어요", "검색어를 바꿔 보세요.")); return; }
  rows.forEach(t => list.append(el("button", { class: "pin", type: "button", "aria-label": t.memo || "썸네일 크게 보기", onclick: () => openThumb(t) },
    el("img", { src: t.imageUrl, alt: "", loading: "lazy" }),
    t.memo ? el("span", { class: "cap" }, t.memo) : null)));
}
async function uploadThumbs(fileList) {
  const files = [...fileList].filter(f => f && f.type && f.type.startsWith("image/"));
  if (!files.length || !userId) return;
  const prog = $("upProg"); prog.hidden = false;
  let done = 0, failed = 0, lastErr = null;
  for (const f of files) {
    prog.textContent = `${done + failed + 1}/${files.length} 올리는 중…`;
    try {
      const blob = await shrink(f);
      const path = `${userId}/thumbs/${newId()}.jpg`;
      const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type || "image/jpeg" });
      if (up.error) throw up.error;
      const { data, error } = await sb.from("thumbs").insert({ image_path: path }).select().single();
      if (error) { await sb.storage.from(BUCKET).remove([path]); throw error; }
      S.thumbs.unshift({ ...data, imageUrl: URL.createObjectURL(blob) });
      done++; if (S.space === "thumbs") render();
    } catch (e) { failed++; lastErr = e; console.error(e); }
  }
  prog.textContent = failed ? `${done}장 올림 · ${failed}장 실패` : `${done}장 올렸어요`;
  if (lastErr) showStatus(explain(lastErr), lastErr.message);
  setTimeout(() => { prog.hidden = true; }, 2500);
}
let viewing = null;
function openThumb(t) {
  viewing = t;
  $("tv-img").src = t.imageUrl; $("tv-date").textContent = fmtDate(t.created_at);
  $("tv-memo").value = t.memo || ""; $("tvErr").hidden = true;
  $("thumbSheet").hidden = false;
}
$("tv-save").addEventListener("click", async () => {
  if (!viewing) return;
  const memo = $("tv-memo").value.trim(), btn = $("tv-save");
  btn.disabled = true; btn.textContent = "저장 중…";
  const { error } = await sb.from("thumbs").update({ memo }).eq("id", viewing.id);
  btn.disabled = false; btn.textContent = "메모 저장";
  if (error) { $("tvErr").textContent = explain(error); $("tvErr").hidden = false; return; }
  viewing.memo = memo; closeSheets(); render();
});
armDelete($("tv-del"), async () => {
  if (!viewing) return;
  const t = viewing;
  const { error } = await sb.from("thumbs").delete().eq("id", t.id);
  if (error) { $("tvErr").textContent = explain(error); $("tvErr").hidden = false; return; }
  await sb.storage.from(BUCKET).remove([t.image_path]);
  S.thumbs = S.thumbs.filter(x => x.id !== t.id); closeSheets(); render();
});

/* 후킹 문구 */
function renderHooks(list) {
  if (!S.hooks.length) { list.append(emptyBox("아직 모은 문구가 없어요", "릴스 자막, 광고 카피, 상세페이지 첫 줄… 눈에 걸린 문장을 그대로 옮겨 두세요.", "+ 첫 문구 추가", () => openHookForm(null))); return; }
  const rows = S.hooks.filter(h => (S.hookCat === "all" || h.category === S.hookCat) && (!S.tag.hooks || (h.tags || []).includes(S.tag.hooks)) && hit([h.text, h.source, h.note, h.idea, (h.tags || []).join(" ")]));
  if (!rows.length) { list.append(emptyBox("조건에 맞는 문구가 없어요", "태그 필터나 검색어를 바꿔 보세요.")); return; }
  rows.forEach(h => list.append(hookCard(h)));
}
function hookCard(h) {
  const copy = el("button", { class: "copybtn", type: "button" }, "복사");
  copy.addEventListener("click", () => copyText(h.text, copy, "복사"));
  const del = el("button", { class: "del", type: "button" }, "삭제");
  armDelete(del, async () => {
    const { error } = await sb.from("hooks").delete().eq("id", h.id);
    if (error) { showStatus(explain(error), error.message); return; }
    S.hooks = S.hooks.filter(x => x.id !== h.id); render();
  });
  const hc = hookCatOf(h.category);
  return el("article", { class: "hook", style: hc ? `--cat:${hc.color}` : "" },
    hc ? el("span", { class: "hcat" }, hc.name) : null,
    el("div", { class: "line" }, el("blockquote", {}, h.text), copy),
    h.source ? el("div", { class: "src" }, "출처 · ", isUrl(h.source) ? el("a", { href: h.source.trim(), target: "_blank", rel: "noopener" }, h.source.trim()) : h.source) : null,
    h.note ? el("p", { class: "note" }, el("span", { class: "k" }, "내 생각"), h.note) : null,
    h.idea ? el("p", { class: "idea" }, el("span", { class: "k" }, "응용 아이디어"), h.idea) : null,
    tagsEl(h.tags),
    el("div", { class: "meta" }, el("time", {}, fmtDate(h.created_at)),
      el("div", { class: "acts" }, el("button", { type: "button", onclick: () => openHookForm(h) }, "수정"), del)));
}
let editingHook = null, hookFormCat = "";
function renderHookCatPick() {
  const box = $("h-cat"); box.textContent = "";
  HOOK_CATS.forEach(c => box.append(el("button", { type: "button", "aria-pressed": String(hookFormCat === c.id), style: `--cat:${c.color}`,
    onclick: () => { hookFormCat = hookFormCat === c.id ? "" : c.id; renderHookCatPick(); } }, c.name)));
}
function openHookForm(h) {
  editingHook = h;
  $("hookFormTitle").textContent = h ? "문구 수정" : "후킹 문구 추가";
  $("h-text").value = h?.text || ""; $("h-src").value = h?.source || "";
  $("h-note").value = h?.note || ""; $("h-idea").value = h?.idea || "";
  $("h-tags").value = (h?.tags || []).join(", ");
  hookFormCat = h ? (h.category || "") : (S.hookCat !== "all" ? S.hookCat : ""); renderHookCatPick();
  $("hookErr").hidden = true; $("hookSheet").hidden = false;
  setTimeout(() => $("h-text").focus(), 30);
}
$("hookForm").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("h-text").value.trim();
  if (!text) { $("hookErr").textContent = "문구를 적어 주세요."; $("hookErr").hidden = false; return; }
  const btn = $("hookSave"); btn.disabled = true; btn.textContent = "저장 중…";
  const row = { text, category: hookFormCat, source: $("h-src").value.trim(), note: $("h-note").value.trim(), idea: $("h-idea").value.trim(), tags: splitTags($("h-tags").value), updated_at: new Date().toISOString() };
  const res = editingHook
    ? await sb.from("hooks").update(row).eq("id", editingHook.id).select().single()
    : await sb.from("hooks").insert(row).select().single();
  btn.disabled = false; btn.textContent = "저장";
  if (res.error) { $("hookErr").textContent = explain(res.error); $("hookErr").hidden = false; console.error(res.error); return; }
  if (editingHook) S.hooks = S.hooks.map(x => x.id === editingHook.id ? res.data : x); else S.hooks.unshift(res.data);
  closeSheets(); render();
});

/* 영상 레퍼런스 입력 */
let editing = null, pendingBlob = null, keepImage = true, formCat = "script";
function renderCatPick() {
  const box = $("f-cat"); box.textContent = "";
  CATS.forEach(c => box.append(el("button", { type: "button", "aria-pressed": String(formCat === c.id), style: `--cat:${c.color}`,
    onclick: () => { formCat = c.id; renderCatPick(); } }, c.name)));
}
function setPreview(src) {
  const img = $("f-prev");
  if (src) { img.src = src; img.hidden = false; $("clearImg").hidden = false; $("dropMsg").textContent = "다른 캡처를 넣으면 바뀌어요"; }
  else { img.removeAttribute("src"); img.hidden = true; $("clearImg").hidden = true; $("dropMsg").textContent = "캡처를 여기에 붙여넣기(⌘V/Ctrl+V)하거나 끌어다 놓기"; }
}
function openRefForm(r) {
  editing = r; pendingBlob = null; keepImage = true;
  $("refFormTitle").textContent = r ? "레퍼런스 수정" : "레퍼런스 추가";
  $("f-url").value = r?.url || ""; $("f-title").value = r?.title || "";
  $("f-plat").value = r?.platform || "릴스"; $("f-tags").value = (r?.tags || []).join(", ");
  $("f-why").value = r?.why || ""; $("f-idea").value = r?.idea || ""; $("f-script").value = r?.script || "";
  formCat = r?.category || (S.curCat !== "all" ? S.curCat : "script");
  renderCatPick(); setPreview(r?.imageUrl || null);
  $("refErr").hidden = true; $("refSheet").hidden = false;
  setTimeout(() => (r ? $("f-title") : $("f-url")).focus(), 30);
}
function takeImage(file) { if (!file || !file.type.startsWith("image/")) return; pendingBlob = file; setPreview(URL.createObjectURL(file)); }
$("f-url").addEventListener("input", e => { if (!editing) $("f-plat").value = detectPlatform(e.target.value); });
$("pickImg").addEventListener("click", () => $("f-file").click());
$("f-file").addEventListener("change", e => { takeImage(e.target.files[0]); e.target.value = ""; });
$("clearImg").addEventListener("click", () => { pendingBlob = null; keepImage = false; setPreview(null); });
$("refForm").addEventListener("paste", e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (item) { e.preventDefault(); takeImage(item.getAsFile()); }
});
const drop = $("drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); takeImage(e.dataTransfer.files[0]); });
$("refForm").addEventListener("submit", async e => {
  e.preventDefault();
  const title = $("f-title").value.trim();
  if (!title) { $("refErr").textContent = "제목을 적어 주세요."; $("refErr").hidden = false; $("f-title").focus(); return; }
  const btn = $("refSave"); btn.disabled = true; btn.textContent = "저장 중…"; $("refErr").hidden = true;
  try {
    const oldPath = editing?.image_path || "";
    let imagePath = keepImage ? oldPath : "";
    if (pendingBlob) {
      const blob = await shrink(pendingBlob);
      const path = `${userId}/${newId()}.jpg`;
      const { error: upErr } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type || "image/jpeg" });
      if (upErr) throw upErr;
      imagePath = path;
    }
    const row = { url: $("f-url").value.trim(), title, category: formCat, platform: $("f-plat").value, tags: splitTags($("f-tags").value),
      why: $("f-why").value.trim(), idea: $("f-idea").value.trim(), script: $("f-script").value.trim(), image_path: imagePath, updated_at: new Date().toISOString() };
    const { error } = editing ? await sb.from("refs").update(row).eq("id", editing.id) : await sb.from("refs").insert(row);
    if (error) throw error;
    if (oldPath && oldPath !== imagePath) await sb.storage.from(BUCKET).remove([oldPath]);
    closeSheets(); await loadAll();
  } catch (err) { $("refErr").textContent = explain(err); $("refErr").hidden = false; console.error(err); }
  finally { btn.disabled = false; btn.textContent = "저장"; }
});

/* ===== 이벤트 ===== */
function closeSheets() { ["refSheet", "hookSheet", "thumbSheet"].forEach(id => $(id).hidden = true); editing = null; editingHook = null; viewing = null; pendingBlob = null; }
const anySheetOpen = () => ["refSheet", "hookSheet", "thumbSheet"].some(id => !$(id).hidden);
document.querySelectorAll(".sheet").forEach(s => s.addEventListener("click", e => { if (e.target === s) closeSheets(); }));
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeSheets));
document.addEventListener("keydown", e => { if (e.key === "Escape" && anySheetOpen()) closeSheets(); });
$("spaces").addEventListener("click", e => { const b = e.target.closest(".space"); if (b) setSpace(b.dataset.space); });
$("addBtn").addEventListener("click", () => {
  if (S.space === "refs") openRefForm(null);
  else if (S.space === "hooks") openHookForm(null);
  else $("thumbFiles").click();
});
$("q").addEventListener("input", e => { S.query = e.target.value; render(); });
$("thumbPick").addEventListener("click", () => $("thumbFiles").click());
$("thumbFiles").addEventListener("change", e => { uploadThumbs(e.target.files); e.target.value = ""; });
const up = $("uploader");
up.addEventListener("dragover", e => { e.preventDefault(); up.classList.add("over"); });
up.addEventListener("dragleave", () => up.classList.remove("over"));
up.addEventListener("drop", e => { e.preventDefault(); up.classList.remove("over"); uploadThumbs(e.dataTransfer.files); });
document.addEventListener("dragover", e => { if (S.space === "thumbs" && !anySheetOpen()) e.preventDefault(); });
document.addEventListener("drop", e => { if (S.space === "thumbs" && !anySheetOpen() && !up.contains(e.target)) { e.preventDefault(); uploadThumbs(e.dataTransfer.files); } });
document.addEventListener("paste", e => {
  if (S.space !== "thumbs" || anySheetOpen() || !userId) return;
  const files = [...(e.clipboardData?.items || [])].filter(i => i.type.startsWith("image/")).map(i => i.getAsFile());
  if (files.length) { e.preventDefault(); uploadThumbs(files); }
});

if (pendingShare) $("loginMsg").textContent = "공유한 링크가 대기 중이에요. 로그인하면 바로 저장 창이 열려요.";
render();
</script>
</body>
</html>
